name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      - name: Check Render API URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [[ -z "$VITE_API_URL" ]]; then
            echo "::error::Set the VITE_API_URL repository variable to your Render API URL before deploying."
            exit 1
          fi
          if [[ "$VITE_API_URL" != https://* ]]; then
            echo "::error::VITE_API_URL must be an https:// URL."
            exit 1
          fi
      - name: Lint, build, and verify production assets
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run lint && npm run build && npm run verify:build
      - name: Add GitHub Pages fallback for client-side routes
        run: cp dist/index.html dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the deployed site serves the Vite build
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          site_url="${SITE_URL%/}"
          html="$(curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors \
            "${site_url}/?deploy-check=${GITHUB_SHA}")"

          if grep -q '/src/main.tsx' <<< "$html"; then
            echo "::error::GitHub Pages is serving source HTML, not the Vite build. Set Settings > Pages > Source to GitHub Actions."
            exit 1
          fi

          script_path="$(grep -oE 'src="[^"]+\.js"' <<< "$html" | head -n 1 | cut -d '"' -f 2)"
          stylesheet_path="$(grep -oE 'href="[^"]+\.css"' <<< "$html" | head -n 1 | cut -d '"' -f 2)"

          if [[ -z "$script_path" || -z "$stylesheet_path" ]]; then
            echo "::error::The deployed page is missing its compiled JavaScript or stylesheet."
            exit 1
          fi

          curl --fail --silent --show-error "${site_url}${script_path}" --output /dev/null
          curl --fail --silent --show-error "${site_url}${stylesheet_path}" --output /dev/null
